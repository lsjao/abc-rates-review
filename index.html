<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#dfe3e8;--accent:#1A3920}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#171d25;--ink:#e6eaef;--mute:#98a3b0;--line:#2a323d;--accent:#7fb68a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{margin:0 0 4px;font-size:20px}p{margin:0 0 16px;color:var(--mute);font-size:14px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}#msg{min-height:1.4em;margin-top:10px;font-size:14px;color:#c62828}
</style></head><body>

</form>
